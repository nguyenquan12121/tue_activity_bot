[project]
name = "myfuture-discord-bot"
version = "0.1.0"
description = "Posts upcoming TU/e MyFuture activities to a Discord channel."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.7,<3",
    "pynacl>=1.6.2",
    "python-dotenv>=1.0",
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
bot = "src.__main__:main"
register = "src.register_commands:main"


[build-system]
requires = ["uv_build>=0.10.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.vercel]
entrypoint = "api.interactions:handler"